name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install GLAD generator dependency
        run: python -m pip install Jinja2==3.1.6
      - name: Install Linux graphics dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xorg-dev libgl1-mesa-dev xvfb xauth
      - name: Configure
        shell: bash
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DPython_EXECUTABLE="$(python -c 'import sys; print(sys.executable)')"
      - name: Build
        run: cmake --build build --config Release --parallel 2
      - name: Test simulation
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Render an OpenGL frame
        if: runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: xvfb-run -a -s '-screen 0 1280x720x24' ./build/conveyor_factory --capture build/overview.ppm --time 24 --view 1
